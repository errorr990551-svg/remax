name: Hostinger Zip Deploy with PHP Auto-Extract

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_prerender:
        description: 'Skip HTML pre-rendering (Fast 30s build)'
        required: false
        type: boolean
        default: false

jobs:
  build-and-deploy:
    name: Build & Fast Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend & Generate Prerendered Pages
        working-directory: frontend
        env:
          PRERENDER_CONCURRENCY: 6
          SKIP_PRERENDER: ${{ github.event.inputs.skip_prerender || 'false' }}
        run: npm run build

      - name: Package Build into Zip & Prepare Auto-Extractor
        run: |
          mkdir -p deploy-package
          
          # Compress dist contents into deploy.zip (ensuring dotfiles like .htaccess are included)
          cd frontend/dist
          zip -r ../../deploy-package/deploy.zip .
          cd ../..
          
          # Generate a secure one-time secret token
          DEPLOY_TOKEN=$(openssl rand -hex 16)
          echo "DEPLOY_TOKEN=${DEPLOY_TOKEN}" >> $GITHUB_ENV
          
          # Copy standalone PHP auto-extractor and inject secret token
          cp .github/scripts/deploy_extract.php deploy-package/deploy_extract.php
          sed -i "s/__SECRET_TOKEN__/${DEPLOY_TOKEN}/g" deploy-package/deploy_extract.php
          echo "Package prepared with deploy.zip and deploy_extract.php"

      - name: 🔍 Resolve & Sanitize FTP Server Host
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER }}"
          # Clean protocol prefix (ftp://, ftps://, etc.), port (:21), trailing slashes, whitespace
          CLEAN=$(echo "$RAW_SERVER" | sed -e 's|^[a-zA-Z]*://||' -e 's|:[0-9]*$||' -e 's|/.*$||' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          
          echo "Sanitized FTP host/IP: '$CLEAN'"
          if [ -z "$CLEAN" ]; then
            echo "❌ Error: FTP_SERVER secret is empty!"
            exit 1
          fi
          
          echo "RESOLVED_FTP_SERVER=$CLEAN" >> $GITHUB_ENV
          echo "Using FTP server: $CLEAN"

      - name: Upload Zip & Extractor via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.RESOLVED_FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-package/
          server-dir: ${{ secrets.FTP_DIR || './' }}
          dangerous-clean-slate: false

      - name: Trigger Remote Auto-Extract & Verification
        run: |
          echo "Waiting for remote filesystem sync..."
          sleep 3
          
          MAX_ATTEMPTS=5
          ATTEMPT=1
          SUCCESS=0
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS: Calling deploy_extract.php..."
            HTTP_STATUS=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" -L --max-time 180 "https://remaxforge.com/deploy_extract.php?token=${DEPLOY_TOKEN}")
            RESPONSE=$(cat /tmp/deploy_response.txt)
            
            echo "HTTP Status: ${HTTP_STATUS}"
            echo "Response: ${RESPONSE}"
            
            if [[ "${RESPONSE}" == *"DEPLOY_SUCCESS"* ]]; then
              echo "🎉 Deployment successfully extracted and verified on Hostinger!"
              SUCCESS=1
              break
            elif [[ "${HTTP_STATUS}" == "404" ]]; then
              echo "File not ready or wrong path, waiting 5 seconds..."
              sleep 5
            else
              echo "Waiting 5 seconds before next retry..."
              sleep 5
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          if [ $SUCCESS -ne 1 ]; then
            echo "❌ Deployment auto-extraction failed."
            if [[ "${HTTP_STATUS}" == "404" ]]; then
              echo "👉 TIP: If deploy_extract.php returned 404, your Hostinger FTP account may point to the user root directory instead of public_html."
              echo "👉 To fix, add a GitHub Secret named FTP_DIR with value: public_html/"
            fi
            exit 1
          fi
