<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0F172A"/>
  <g stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M 0,50 H 600 M 0,100 H 600 M 0,150 H 600 M 0,200 H 600 M 0,250 H 600"/>
    <path d="M 100,0 V 300 M 200,0 V 300 M 300,0 V 300 M 400,0 V 300 M 500,0 V 300"/>
  </g>
  <line x1="300" y1="20" x2="300" y2="280" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="8 6"/>
  
  <!-- Left Side Flange Section with Tapered Hub -->
  <path d="M 80,180 H 180 V 140 L 225,80 V 180 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <!-- Right Side Flange Section with Tapered Hub -->
  <path d="M 520,180 H 420 V 140 L 375,80 V 180 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  
  <!-- Bolt Holes -->
  <rect x="120" y="180" width="20" height="3" fill="#EF4444" opacity="0.8"/>
  <line x1="130" y1="170" x2="130" y2="190" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="460" y="180" width="20" height="3" fill="#EF4444" opacity="0.8"/>
  <line x1="470" y1="170" x2="470" y2="190" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Dimension Lines -->
  <!-- Flange OD -->
  <line x1="80" y1="220" x2="520" y2="220" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M 80,215 L 70,220 L 80,225 Z" fill="#E2E8F0"/>
  <path d="M 520,215 L 530,220 L 520,225 Z" fill="#E2E8F0"/>
  <text x="300" y="240" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">Flange OD (O)</text>
  
  <!-- Weld Bevel Diameter -->
  <line x1="225" y1="50" x2="375" y2="50" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M 225,45 L 215,50 L 225,55 Z" fill="#E2E8F0"/>
  <path d="M 375,45 L 385,50 L 375,55 Z" fill="#E2E8F0"/>
  <text x="300" y="40" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">Weld Neck OD (A)</text>
  
  <!-- Hub Length -->
  <line x1="40" y1="80" x2="40" y2="180" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M 35,80 L 40,70 L 45,80 Z" fill="#E2E8F0"/>
  <path d="M 35,180 L 40,190 L 45,180 Z" fill="#E2E8F0"/>
  <text x="25" y="135" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle" transform="rotate(-90 25 135)">Hub Ht (H)</text>
  
  <text x="300" y="280" fill="#38BDF8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ASME B16.5 WELD NECK FLANGE DESIGN</text>
</svg>