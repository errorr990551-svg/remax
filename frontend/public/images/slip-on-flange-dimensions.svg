<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0F172A"/>
  <g stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M 0,50 H 600 M 0,100 H 600 M 0,150 H 600 M 0,200 H 600 M 0,250 H 600"/>
    <path d="M 100,0 V 300 M 200,0 V 300 M 300,0 V 300 M 400,0 V 300 M 500,0 V 300"/>
  </g>
  <line x1="300" y1="20" x2="300" y2="280" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="8 6"/>
  
  <!-- Left Side Flange Section -->
  <path d="M 80,180 H 180 V 130 H 220 V 100 H 230 V 180 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <!-- Right Side Flange Section -->
  <path d="M 520,180 H 420 V 130 H 380 V 100 H 370 V 180 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  
  <!-- Pipe outline dotted -->
  <path d="M 225,180 V 80 M 375,180 V 80" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Bolt Holes -->
  <rect x="120" y="180" width="20" height="3" fill="#EF4444" opacity="0.8"/>
  <line x1="130" y1="170" x2="130" y2="190" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="460" y="180" width="20" height="3" fill="#EF4444" opacity="0.8"/>
  <line x1="470" y1="170" x2="470" y2="190" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Dimension Lines -->
  <!-- Flange OD -->
  <line x1="80" y1="220" x2="520" y2="220" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M 80,215 L 70,220 L 80,225 Z" fill="#E2E8F0"/>
  <path d="M 520,215 L 530,220 L 520,225 Z" fill="#E2E8F0"/>
  <text x="300" y="240" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">Flange OD (O)</text>
  
  <!-- Bolt Circle -->
  <line x1="130" y1="20" x2="470" y2="20" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M 130,15 L 120,20 L 130,25 Z" fill="#E2E8F0"/>
  <path d="M 470,15 L 480,20 L 470,25 Z" fill="#E2E8F0"/>
  <text x="300" y="40" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">Bolt Circle (W)</text>
  
  <!-- Bore ID -->
  <line x1="220" y1="70" x2="380" y2="70" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M 220,65 L 210,70 L 220,75 Z" fill="#E2E8F0"/>
  <path d="M 380,65 L 390,70 L 380,75 Z" fill="#E2E8F0"/>
  <text x="300" y="90" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">Bore ID (B)</text>
  
  <text x="300" y="280" fill="#38BDF8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ASME B16.5 SLIP ON FLANGE DESIGN</text>
</svg>