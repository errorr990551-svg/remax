<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0F172A"/>
  <g stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M 0,50 H 600 M 0,100 H 600 M 0,150 H 600 M 0,200 H 600 M 0,250 H 600"/>
    <path d="M 100,0 V 300 M 200,0 V 300 M 300,0 V 300 M 400,0 V 300 M 500,0 V 300"/>
  </g>
  <line x1="300" y1="20" x2="300" y2="280" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="8 6"/>
  
  <!-- Blind Flange cross section (Solid Center) -->
  <path d="M 80,160 H 520 V 120 H 80 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  
  <!-- Bolt Holes -->
  <rect x="120" y="120" width="20" height="40" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="130" y1="110" x2="130" y2="170" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="460" y="120" width="20" height="40" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="470" y1="110" x2="470" y2="170" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Dimension Lines -->
  <!-- Flange OD -->
  <line x1="80" y1="220" x2="520" y2="220" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M 80,215 L 70,220 L 80,225 Z" fill="#E2E8F0"/>
  <path d="M 520,215 L 530,220 L 520,225 Z" fill="#E2E8F0"/>
  <text x="300" y="240" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">Flange OD (O)</text>
  
  <!-- Thickness -->
  <line x1="550" y1="120" x2="550" y2="160" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M 545,120 L 550,110 L 555,120 Z" fill="#E2E8F0"/>
  <path d="M 545,160 L 550,170 L 555,160 Z" fill="#E2E8F0"/>
  <text x="565" y="145" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="start">Thickness (T)</text>
  
  <text x="300" y="280" fill="#38BDF8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ASME B16.5 BLIND FLANGE DESIGN</text>
</svg>