<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0F172A"/>
  <g stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M 0,50 H 600 M 0,100 H 600 M 0,150 H 600 M 0,200 H 600 M 0,250 H 600"/>
    <path d="M 100,0 V 300 M 200,0 V 300 M 300,0 V 300 M 400,0 V 300 M 500,0 V 300"/>
  </g>
  
  <!-- Figure-8 layout (Spectacle Blind) front view -->
  <!-- Left Side: Solid Disc -->
  <circle cx="200" cy="150" r="70" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
  
  <!-- Right Side: Ring (Open center) -->
  <circle cx="400" cy="150" r="70" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="400" cy="150" r="40" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  
  <!-- Connection Bridge Web (Handle) -->
  <rect x="255" y="140" width="90" height="20" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="300" cy="150" r="6" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
  
  <!-- Labels -->
  <text x="200" y="154" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">BLIND DISC</text>
  <text x="400" y="154" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">OPEN RING</text>
  <text x="300" y="130" fill="#38BDF8" font-family="sans-serif" font-size="10" text-anchor="middle">Tie bar</text>
  
  <text x="300" y="260" fill="#38BDF8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ASME B16.48 SPECTACLE BLIND DESIGN (FIGURE-8)</text>
</svg>