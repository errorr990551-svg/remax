<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0F172A"/>
  <g stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M 0,50 H 600 M 0,100 H 600 M 0,150 H 600 M 0,200 H 600 M 0,250 H 600"/>
    <path d="M 100,0 V 300 M 200,0 V 300 M 300,0 V 300 M 400,0 V 300 M 500,0 V 300"/>
  </g>
  <line x1="300" y1="20" x2="300" y2="280" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="8 6"/>
  
  <!-- Left Side with elongated neck -->
  <path d="M 80,180 H 180 V 130 H 220 V 40 H 230 V 180 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <!-- Right Side with elongated neck -->
  <path d="M 520,180 H 420 V 130 H 380 V 40 H 370 V 180 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  
  <!-- Dimension Lines -->
  <!-- Long Neck Length -->
  <line x1="170" y1="40" x2="170" y2="180" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M 165,40 L 170,30 L 175,40 Z" fill="#E2E8F0"/>
  <path d="M 165,180 L 170,190 L 175,180 Z" fill="#E2E8F0"/>
  <text x="155" y="110" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle" transform="rotate(-90 155 110)">Neck Length (L)</text>
  
  <text x="300" y="280" fill="#38BDF8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">LONG WELD NECK FLANGE DESIGN</text>
</svg>