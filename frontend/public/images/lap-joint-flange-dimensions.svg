<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0F172A"/>
  <g stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M 0,50 H 600 M 0,100 H 600 M 0,150 H 600 M 0,200 H 600 M 0,250 H 600"/>
    <path d="M 100,0 V 300 M 200,0 V 300 M 300,0 V 300 M 400,0 V 300 M 500,0 V 300"/>
  </g>
  <line x1="300" y1="20" x2="300" y2="280" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="8 6"/>
  
  <!-- Backing Flange (gray) and Stub End (golden/blue) -->
  <!-- Left Backing Flange with fillet -->
  <path d="M 80,180 H 170 C 175,180 180,175 180,170 V 130 H 220 V 100 H 230 V 180 Z" fill="#334155" stroke="#38BDF8" stroke-width="2"/>
  <!-- Right Backing Flange -->
  <path d="M 520,180 H 430 C 425,180 420,175 420,170 V 130 H 380 V 100 H 370 V 180 Z" fill="#334155" stroke="#38BDF8" stroke-width="2"/>
  
  <!-- Left Stub End (golden) -->
  <path d="M 175,190 H 215 V 90 H 225 V 190 H 175 Z" fill="#B45309" stroke="#F59E0B" stroke-width="1.5"/>
  <!-- Right Stub End -->
  <path d="M 425,190 H 385 V 90 H 375 V 190 H 425 Z" fill="#B45309" stroke="#F59E0B" stroke-width="1.5"/>
  
  <!-- Dimension Lines -->
  <!-- Lap Radius -->
  <text x="300" y="140" fill="#F59E0B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Mating Stub End (Collar)</text>
  <text x="300" y="165" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Backing Flange slides freely</text>
  
  <text x="300" y="280" fill="#38BDF8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ASME B16.5 LAP JOINT FLANGE DESIGN</text>
</svg>